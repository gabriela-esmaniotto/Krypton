<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1014" />
      <stop offset="50%" stop-color="#0a0b0d" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <radialGradient id="emeraldAmbient" cx="76%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.11" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <pattern id="cadGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.035" />
    </pattern>

    <pattern id="cadSubGrid" width="320" height="320" patternUnits="userSpaceOnUse">
      <path d="M 320 0 L 0 0 0 320" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.06" />
      <path d="M 316 0 L 320 0 L 320 4" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#studioBg)" />
  <rect width="1600" height="900" fill="url(#emeraldAmbient)" />
  <rect width="1600" height="900" fill="url(#cadGrid)" />
  <rect width="1600" height="900" fill="url(#cadSubGrid)" />

  <!-- Precision Technical Geometry (Right Anchor) -->
  <g transform="translate(1160, 440)" stroke="#ffffff" fill="none">
    <circle r="340" stroke-opacity="0.05" stroke-width="1" />
    <circle r="240" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="-420" y1="0" x2="420" y2="0" stroke-opacity="0.04" stroke-width="1" />
    <line x1="0" y1="-420" x2="0" y2="420" stroke-opacity="0.04" stroke-width="1" />
  </g>
</svg>
